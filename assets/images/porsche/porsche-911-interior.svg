<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Porsche 911 Carrera GTS driver cockpit studio view">
  <defs>
    <radialGradient id="bgGlow" cx="52%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#28313e"/>
      <stop offset="55%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0b0c0f"/>
    </radialGradient>
    <linearGradient id="dashAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3c852" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#f3c852" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f3c852" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22262f"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgGlow)"/>
  <!-- Dashboard Arch & Ambient Trim -->
  <path d="M80 390 Q600 220 1120 390 L1160 660 L40 660 Z" fill="url(#leather)" stroke="#2e3440" stroke-width="2"/>
  <path d="M120 415 Q600 265 1080 415" fill="none" stroke="url(#dashAccent)" stroke-width="4"/>
  <!-- 5-Dial Heritage Instrument Cluster -->
  <g transform="translate(600,375)">
    <rect x="-240" y="-75" width="480" height="145" rx="70" fill="#0d0f13" stroke="#363d4a" stroke-width="3"/>
    <circle cx="-155" cy="0" r="38" fill="#13161c" stroke="#454d5c" stroke-width="2"/>
    <circle cx="-80" cy="0" r="44" fill="#13161c" stroke="#535d6e" stroke-width="2"/>
    <circle cx="0" cy="0" r="54" fill="#141820" stroke="#f3c852" stroke-width="2.5"/>
    <circle cx="80" cy="0" r="44" fill="#13161c" stroke="#535d6e" stroke-width="2"/>
    <circle cx="155" cy="0" r="38" fill="#13161c" stroke="#454d5c" stroke-width="2"/>
    <!-- Tachometer Needle -->
    <line x1="0" y1="0" x2="32" y2="-28" stroke="#f3c852" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="7" fill="#f3c852"/>
  </g>
  <!-- Sport Steering Wheel -->
  <g transform="translate(600,505)">
    <circle cx="0" cy="0" r="185" fill="none" stroke="#181b21" stroke-width="34"/>
    <circle cx="0" cy="0" r="185" fill="none" stroke="#3a414e" stroke-width="2"/>
    <rect x="-6" y="-202" width="12" height="34" rx="3" fill="#f3c852"/>
    <!-- Spokes & Center Hub -->
    <path d="M-165 -15 L-55 -10 L-55 25 L-165 25 Z" fill="#1d2129" stroke="#39404d"/>
    <path d="M165 -15 L55 -10 L55 25 L165 25 Z" fill="#1d2129" stroke="#39404d"/>
    <path d="M-25 45 L25 45 L18 168 L-18 168 Z" fill="#1d2129" stroke="#39404d"/>
    <circle cx="0" cy="5" r="58" fill="#15181e" stroke="#464e5e" stroke-width="2.5"/>
    <polygon points="0,-16 14,-2 8,18 -8,18 -14,-2" fill="none" stroke="#f3c852" stroke-width="2"/>
  </g>
  <!-- Center Console & Sport Chrono Stopwatch -->
  <circle cx="600" cy="245" r="24" fill="#121419" stroke="#f3c852" stroke-width="2"/>
  <line x1="600" y1="245" x2="611" y2="234" stroke="#f3c852" stroke-width="2.5" stroke-linecap="round"/>
</svg>
